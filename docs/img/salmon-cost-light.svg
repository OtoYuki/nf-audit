<title id="t">nf-core/rnaseq full-size test, star_salmon: cost per release</title>
<desc id="d">Stacked columns for 30 releases from 3.1 to 3.26.0. Cost fell from $139 to $60; the part reserved but never used stayed at 62 to 68 percent of metered cost in 28 of them.</desc>
