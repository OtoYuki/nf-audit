<text x="58.0" y="52.0" font-size="13" fill="#5A6042" text-anchor="start" font-weight="400">One run per release, priced at Seqera Compute list rates.</text>
<text x="58.0" y="70.0" font-size="13" fill="#5A6042" text-anchor="start" font-weight="400">The idle share stayed at 62–68% in 28 of 30 releases while the cost fell.</text>
