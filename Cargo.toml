[package]
name = "nf-audit"
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
description = "Cost and right-sizing audit of Nextflow runs from execution traces and reports"
license = "MIT"
authors = ["Sushant Hona"]
repository = "https://github.com/OtoYuki/nf-audit"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
